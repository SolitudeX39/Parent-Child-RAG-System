services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parent-child-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectordb3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  neo4j:
    image: neo4j:5
    container_name: parent-child-rag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/newpassword
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
